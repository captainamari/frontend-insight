name: M2-M4 SDK, pipeline and management API

on:
  push:
    branches:
      - "agent/m1-*"
      - "agent/m2-*"
      - "agent/m3-*"
      - "agent/m4-*"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: m2-m4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m2-m4:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      M24_ALLOW_NON_ARM64: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.15.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static checks and unit contracts
        run: pnpm check

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Chromium and WebKit SDK contracts
        run: pnpm test:browser

      - name: Validate operations script
        run: bash -n scripts/m2-m4

      - name: Start M2-M4 integration stack
        run: ./scripts/m2-m4 up

      - name: Verify browser-to-analytics flow
        run: ./scripts/m2-m4 verify

      - name: Capture service health
        run: ./scripts/m2-m4 status

      - name: Capture logs on failure
        if: failure()
        run: |
          ./scripts/m2-m4 logs api
          ./scripts/m2-m4 logs consumer
          ./scripts/m2-m4 logs kafka
          ./scripts/m2-m4 logs clickhouse

      - name: Stop stack and preserve diagnostics
        if: always()
        run: ./scripts/m2-m4 down

      - name: Publish connector-visible result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then state="success"; else state="failure"; fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"M2-M4 full flow: ${JOB_STATUS}\",\"context\":\"m2-m4/full-flow\"}"
