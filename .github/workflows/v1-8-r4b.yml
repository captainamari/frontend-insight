name: v1.8 R4-B workflow implementation and accepted regressions

on:
  push:
    branches:
      - "agent/v1-8-r4b-*"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: v1-8-r4b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r4b-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      M5_ALLOW_NON_ARM64: "1"
      FI_PRIVACY_NO_TRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.15.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete static, unit and build gate
        run: pnpm check

      - name: Record SDK bundle delta against the inherited base
        run: |
          git fetch --depth=1 origin 76a96dea8aeb00db9088e2547250aaa59034a629
          pnpm --filter @frontend-insight/web-tracker exec node scripts/r4b-budget.mjs

      - name: Verify actual checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run focused R4-B tests
        run: pnpm test:r4b

      - name: Run focused R4-A tests
        run: pnpm test:r4a

      - name: Run focused R3 calendar, API and read-model tests
        run: pnpm test:r3

      - name: Run focused R2 entry tests
        run: pnpm test:r2

      - name: Run R1-C score product and calculation tests
        run: pnpm test:r1c

      - name: Run focused R1-B formula and API tests
        run: pnpm test:r1b

      - name: Run accepted R1-A regression tests
        run: pnpm test:r1a

      - name: Validate local operations entrypoint
        run: bash -n scripts/dev

      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Rebuild, seed and smoke the empty baseline
        run: |
          ./scripts/dev reset --confirm-local-data-loss
          ./scripts/dev bootstrap
          ./scripts/dev up
          ./scripts/dev smoke

      - name: Verify data-preserving 001-002 to 003-004 migration
        run: ./scripts/dev verify-r2-upgrade

      - name: Verify real MySQL and API metric-library flow
        run: ./scripts/dev verify-r1b

      - name: Verify real R1-A MySQL and API regressions
        run: ./scripts/dev verify-r1a

      - name: Run R1-B admin and viewer product flows
        run: pnpm test:r1b:e2e

      - name: Run R1-A Chromium and WebKit product regression
        run: pnpm test:r1a:e2e

      - name: Verify real R1-C snapshots, permissions, audit and history
        run: ./scripts/dev verify-r1c

      - name: Run R1-C Chromium and WebKit admin and viewer product flows
        run: pnpm test:r1c:e2e

      - name: Verify R2 real MySQL, ClickHouse, API and 20-project p95
        run: ./scripts/dev verify-r2

      - name: Run R2 Chromium and WebKit full admin and viewer flows
        run: pnpm test:r2:e2e

      - name: Verify R3 real MySQL, ClickHouse, isolated versions, bindings and p95
        run: ./scripts/dev verify-r3

      - name: Run R3 Chromium and WebKit admin/viewer flows and isolated fixtures
        run: pnpm test:r3:e2e

      - name: Verify R4-A real MySQL ClickHouse API and performance
        run: ./scripts/dev verify-r4a

      - name: Run R4-A Chromium and WebKit admin viewer products
        run: pnpm test:r4a:e2e

      - name: Verify real R4-B browser SDK and product chain
        run: pnpm test:r4b:e2e

      - name: Verify project search values stay out of access logs
        run: |
          curl --silent --output /dev/null 'http://127.0.0.1:4173/api/projects/summary?search=FI_R2_PRIVATE_QUERY_SENTINEL'
          ./scripts/dev logs web > /tmp/r2-web-access.log
          if grep -q FI_R2_PRIVATE_QUERY_SENTINEL /tmp/r2-web-access.log; then
            echo 'R2 search value leaked into web access logs'
            exit 1
          fi
          grep -q '"requestId"' /tmp/r2-web-access.log

      - name: Record the exact verified product commit
        run: |
          mkdir -p artifacts
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("artifacts/r4b-evidence.json", JSON.stringify({baseline:"76a96dea8aeb00db9088e2547250aaa59034a629", inheritedAcceptedCommit:"7f1d9c89f2c4b10f14003d65d292fb56f6936c76", testedCommit:process.env.GITHUB_SHA, runId:process.env.GITHUB_RUN_ID, runAttempt:process.env.GITHUB_RUN_ATTEMPT, scope:"R4-B delivery plus R1-A through R4-A regressions", implementation:"implemented within authorized scope; manual acceptance pending", manualAcceptanceReady:true, unresolvedExtensions:["Q07 step partial completion", "Q08 optional/skipped intermediate steps"], dataDependency:"PENETRATION_SOURCE_MISSING", automation:"passed", realIntegration:"passed", browsers:["chromium","webkit"], manualAcceptance:"pending Jesse", milestoneComplete:false}, null, 2))'

      - name: Upload exact-commit verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4b-product-evidence
          path: |
            artifacts/*.json
            test-results

      - name: Capture service logs on failure
        if: failure()
        run: ./scripts/dev logs

      - name: Stop local services
        if: always()
        run: ./scripts/dev down

  r4b-sdk-preflight:
    name: isolated R4-B SDK diagnostic (full ordered gate still required)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      M5_ALLOW_NON_ARM64: "1"
      FI_PRIVACY_NO_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Start a separate empty runner stack
        run: |
          ./scripts/dev bootstrap
          ./scripts/dev up
          ./scripts/dev smoke
      - name: Exercise the actual SDK chain early in an isolated project
        run: pnpm test:r4b:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4b-sdk-diagnostic
          path: |
            artifacts/r4b-*.json
            test-results
      - name: Capture safe service diagnostics
        if: failure()
        run: ./scripts/dev logs
      - name: Stop diagnostic stack
        if: always()
        run: ./scripts/dev down
