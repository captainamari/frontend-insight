name: v1.8 R0 contract and empty baseline

on:
  push:
    branches:
      - "agent/v1-8-r0-*"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: v1-8-r0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r0:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      M5_ALLOW_NON_ARM64: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.15.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated contract and canonical names
        run: |
          pnpm contract:check
          pnpm canonical:check

      - name: Run R0 static and focused unit checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Validate local operations entrypoint
        run: bash -n scripts/dev

      - name: Install R0 browser engine
        run: pnpm exec playwright install --with-deps chromium

      - name: Rebuild, seed and verify the empty R0 baseline
        run: |
          ./scripts/dev reset --confirm-local-data-loss
          ./scripts/dev bootstrap
          ./scripts/dev up
          ./scripts/dev seed
          ./scripts/dev smoke

      - name: Run R0 HTTP acceptance
        run: pnpm test:r0:e2e

      - name: Reuse the local stack and repeat tool-image acceptance
        run: |
          ./scripts/dev seed
          ./scripts/dev smoke

      - name: Capture service logs on failure
        if: failure()
        run: ./scripts/dev logs

      - name: Stop R0 services
        if: always()
        run: ./scripts/dev down
