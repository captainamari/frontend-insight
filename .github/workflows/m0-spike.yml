name: M0 technical spike

on:
  push:
    branches:
      - "agent/m0-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      M0_ALLOW_NON_ARM64: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: spikes/m0/package-lock.json

      - name: Install spike dependencies
        working-directory: spikes/m0
        run: npm ci

      - name: Run static, unit and HTTP integration tests
        working-directory: spikes/m0
        run: npm test

      - name: Validate local operations script
        run: bash -n scripts/dev

      - name: Validate target Compose config
        run: ./scripts/dev doctor

      - name: Start M0 stack
        run: ./scripts/dev m0-up

      - name: Run full M0 verification
        run: ./scripts/dev m0-verify

      - name: Capture service health and resources
        run: ./scripts/dev m0-status

      - name: Capture logs on failure
        if: failure()
        run: ./scripts/dev m0-logs

      - name: Stop stack and preserve diagnostic volumes
        if: always()
        run: ./scripts/dev m0-down
