name: v1.8 R2 project entry and accepted regressions

on:
  push:
    branches:
      - "agent/v1-8-r2-*"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: v1-8-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r2-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      M5_ALLOW_NON_ARM64: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.15.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete static, unit and build gate
        run: pnpm check

      - name: Verify actual checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run focused R2 entry tests
        run: pnpm test:r2

      - name: Run R1-C score product and calculation tests
        run: pnpm test:r1c

      - name: Run focused R1-B formula and API tests
        run: pnpm test:r1b

      - name: Run accepted R1-A regression tests
        run: pnpm test:r1a

      - name: Validate local operations entrypoint
        run: bash -n scripts/dev

      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Rebuild, seed and smoke the empty baseline
        run: |
          ./scripts/dev reset --confirm-local-data-loss
          ./scripts/dev bootstrap
          ./scripts/dev up
          ./scripts/dev smoke

      - name: Verify data-preserving 001-002 to 003 migration
        run: ./scripts/dev verify-r2-upgrade

      - name: Verify real MySQL and API metric-library flow
        run: ./scripts/dev verify-r1b

      - name: Verify real R1-A MySQL and API regressions
        run: ./scripts/dev verify-r1a

      - name: Run R1-B admin and viewer product flows
        run: pnpm test:r1b:e2e

      - name: Run R1-A Chromium and WebKit product regression
        run: pnpm test:r1a:e2e

      - name: Verify real R1-C snapshots, permissions, audit and history
        run: ./scripts/dev verify-r1c

      - name: Run R1-C Chromium and WebKit admin and viewer product flows
        run: pnpm test:r1c:e2e

      - name: Verify R2 real MySQL, ClickHouse, API and 20-project p95
        run: ./scripts/dev verify-r2

      - name: Run R2 Chromium and WebKit full admin and viewer flows
        run: pnpm test:r2:e2e

      - name: Record the exact verified product commit
        run: |
          mkdir -p artifacts
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("artifacts/r2-evidence.json", JSON.stringify({baseline:"cfd90863827b7dad64007bcfd681f0b7d29e3489", inheritedAcceptedCommit:"d37059bb32daf2c857747905d0873b719c323de8", testedCommit:process.env.GITHUB_SHA, runId:process.env.GITHUB_RUN_ID, runAttempt:process.env.GITHUB_RUN_ATTEMPT, scope:"R2 entry and accepted R1-A/R1-B/R1-C regressions", implementation:"delivered for manual review", automation:"passed", realIntegration:"passed", browsers:["chromium","webkit"], manualAcceptance:"pending Jesse", milestoneComplete:false}, null, 2))'

      - name: Upload exact-commit verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-product-evidence
          path: |
            artifacts/*.json
            test-results

      - name: Capture service logs on failure
        if: failure()
        run: ./scripts/dev logs

      - name: Stop local services
        if: always()
        run: ./scripts/dev down
