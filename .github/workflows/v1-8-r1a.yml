name: v1.8 R1-A analysis objects

on:
  push:
    branches:
      - "agent/v1-8-r1a-*"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: v1-8-r1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r1a:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      M5_ALLOW_NON_ARM64: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.15.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full static, unit and build checks
        run: pnpm check

      - name: Run focused R1-A tests
        run: pnpm test:r1a

      - name: Validate local operations entrypoint
        run: bash -n scripts/dev

      - name: Install R1-A browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Rebuild, seed and smoke the empty baseline
        run: |
          ./scripts/dev reset --confirm-local-data-loss
          ./scripts/dev bootstrap
          ./scripts/dev up
          ./scripts/dev smoke

      - name: Verify analysis-object API, isolation and audit
        run: ./scripts/dev verify-r1a

      - name: Run R1-A admin and viewer product flows
        run: pnpm test:r1a:e2e

      - name: Capture service logs on failure
        if: failure()
        run: ./scripts/dev logs

      - name: Stop R1-A services
        if: always()
        run: ./scripts/dev down
