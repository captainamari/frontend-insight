name: v1.8 R8 documentation evidence
on:
  push:
    branches: ["agent/v1-8-r8-*"]
    paths: ["docs/**", "README.md"]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm canonical:check
