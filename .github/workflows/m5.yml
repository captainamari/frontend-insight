name: M5 local product loop

on:
  push:
    branches:
      - "agent/m5-*"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: m5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m5:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      M5_ALLOW_NON_ARM64: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.15.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static, unit and build checks
        run: pnpm check

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run SDK browser contracts
        run: pnpm test:browser

      - name: Validate local operations script
        run: bash -n scripts/dev

      - name: Validate M5 Compose configuration
        run: ./scripts/dev doctor

      - name: Start complete M5 product
        run: ./scripts/dev up

      - name: Seed and verify data flow
        run: ./scripts/dev smoke

      - name: Run M5 product acceptance in Chromium and WebKit
        run: pnpm test:m5:e2e

      - name: Capture service health
        run: ./scripts/dev status

      - name: Capture logs on failure
        if: failure()
        run: |
          ./scripts/dev logs api
          ./scripts/dev logs consumer
          ./scripts/dev logs web
          ./scripts/dev logs demo

      - name: Stop stack and preserve diagnostics
        if: always()
        run: ./scripts/dev down

      - name: Publish connector-visible result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then state="success"; else state="failure"; fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"M5 product loop: ${JOB_STATUS}\",\"context\":\"m5/product-loop\"}"
