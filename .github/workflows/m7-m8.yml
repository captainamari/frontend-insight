name: M7 hardening and M8 observability

on:
  push:
    branches:
      - "agent/m7-m8-*"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - "scripts/**"
      - "tools/**"
      - "tests/m8/**"
      - "playwright.m8.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/m7-m8.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: m7-m8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening-observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      M5_ALLOW_NON_ARM64: "1"
      FI_ALLOW_CONSTRAINED_HOST: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.15.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static, unit and build checks
        run: pnpm check

      - name: Validate operations scripts
        run: bash -n scripts/dev scripts/m7 scripts/production

      - name: Generate ephemeral CI secrets and validate production policy
        run: |
          bash scripts/production init-secrets --confirm-create
          bash scripts/production doctor

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run SDK browser contracts
        run: pnpm test:browser

      - name: Start complete product and seed M6/M8 evidence
        run: |
          ./scripts/dev up
          ./scripts/dev smoke

      - name: Run full M7 load profiles
        run: bash scripts/m7 load full

      - name: Run Kafka, ClickHouse and consumer fault injection
        run: bash scripts/m7 fault all --confirm-disruption

      - name: Run additive upgrade, rollback posture and restore drill
        run: bash scripts/m7 release-drill --confirm-disruption

      - name: Run M5 and M6 regressions
        run: |
          pnpm test:m5:e2e
          pnpm test:m6:e2e

      - name: Run M8 acceptance in Chromium and WebKit
        run: pnpm test:m8:e2e

      - name: Capture service health
        run: ./scripts/dev status

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          ./scripts/dev logs api
          ./scripts/dev logs consumer
          ./scripts/dev logs clickhouse
          ./scripts/dev logs kafka
          ./scripts/dev logs web

      - name: Stop stack and preserve diagnostics
        if: always()
        run: ./scripts/dev down

      - name: Publish connector-visible result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then state="success"; else state="failure"; fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"M7/M8 product loop: ${JOB_STATUS}\",\"context\":\"m7-m8/product-loop\"}"
