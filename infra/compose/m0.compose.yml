services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${M0_MYSQL_ROOT_PASSWORD:-m0-root-local-only}
      MYSQL_DATABASE: frontend_insight_m0
      MYSQL_USER: m0
      MYSQL_PASSWORD: ${M0_MYSQL_PASSWORD:-m0-mysql-local-only}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    networks: [m0]

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: frontend_insight_m0
      CLICKHOUSE_USER: m0
      CLICKHOUSE_PASSWORD: ${M0_CLICKHOUSE_PASSWORD:-m0-clickhouse-local-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    networks: [m0]

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped
    networks: [m0]

  spike-app:
    build:
      context: ../../spikes/m0
    environment:
      M0_API_PORT: "3100"
      M0_DEMO_PORT: "4173"
      M0_API_BASE_URL: http://spike-app:3100
      M0_DEMO_BASE_URL: http://spike-app:4173
      M0_PUBLIC_API_URL: http://localhost:${M0_API_PORT:-3100}
      M0_ALLOWED_ORIGIN: ${M0_ALLOWED_ORIGIN:-http://localhost:4173}
      M0_KAFKA_BROKERS: kafka:9092
      M0_KAFKA_PUBLISHER_ENABLED: "1"
      M0_ACCOUNT_HMAC_KEY: ${M0_ACCOUNT_HMAC_KEY:-m0-account-hmac-local-only-change-me}
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    ports:
      - 127.0.0.1:${M0_API_PORT:-3100}:3100
      - 127.0.0.1:${M0_DEMO_PORT:-4173}:4173
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks: [m0]

  spike-consumer:
    build:
      context: ../../spikes/m0
    command: ["node", "src/consumer.mjs"]
    environment:
      M0_CLICKHOUSE_URL: http://clickhouse:8123
      M0_CLICKHOUSE_USER: m0
      M0_CLICKHOUSE_PASSWORD: ${M0_CLICKHOUSE_PASSWORD:-m0-clickhouse-local-only}
      M0_CLICKHOUSE_DATABASE: frontend_insight_m0
      M0_KAFKA_BROKERS: kafka:9092
      M0_CONSUMER_HEALTH_PORT: "3200"
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3200/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [m0]

  spike-runner:
    build:
      context: ../../spikes/m0
    command: ["node", "src/verify.mjs"]
    environment:
      M0_MYSQL_HOST: mysql
      M0_MYSQL_USER: m0
      M0_MYSQL_PASSWORD: ${M0_MYSQL_PASSWORD:-m0-mysql-local-only}
      M0_MYSQL_DATABASE: frontend_insight_m0
      M0_CLICKHOUSE_URL: http://clickhouse:8123
      M0_CLICKHOUSE_USER: m0
      M0_CLICKHOUSE_PASSWORD: ${M0_CLICKHOUSE_PASSWORD:-m0-clickhouse-local-only}
      M0_CLICKHOUSE_DATABASE: frontend_insight_m0
      M0_KAFKA_BROKERS: kafka:9092
      M0_API_BASE_URL: http://spike-app:3100
      M0_DEMO_BASE_URL: http://spike-app:4173
      M0_PUBLIC_API_URL: http://localhost:${M0_API_PORT:-3100}
      M0_ALLOWED_ORIGIN: ${M0_ALLOWED_ORIGIN:-http://localhost:4173}
      M0_ACCOUNT_HMAC_KEY: ${M0_ACCOUNT_HMAC_KEY:-m0-account-hmac-local-only-change-me}
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      spike-app:
        condition: service_healthy
      spike-consumer:
        condition: service_healthy
    networks: [m0]

volumes:
  mysql-data:
  clickhouse-data:
  kafka-data:

networks:
  m0:
    driver: bridge
