x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: ${FI_LOG_MAX_SIZE:-20m}
    max-file: ${FI_LOG_MAX_FILES:-5}

x-app-secrets: &app-secrets
  - mysql_url
  - clickhouse_password

services:
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_PASSWORD: ""
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *json-logging
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          cpus: "2.0"
          memory: 2G

  clickhouse:
    environment:
      CLICKHOUSE_PASSWORD: ""
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        export CLICKHOUSE_PASSWORD="$$(cat /run/secrets/clickhouse_password)"
        exec /entrypoint.sh
    secrets:
      - clickhouse_password
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *json-logging
    deploy:
      resources:
        reservations:
          memory: 1G
        limits:
          cpus: "4.0"
          memory: 4G

  kafka:
    environment:
      KAFKA_LOG_RETENTION_HOURS: ${FI_KAFKA_RETENTION_HOURS:-168}
      KAFKA_LOG_SEGMENT_BYTES: "268435456"
      KAFKA_LOG_CLEANUP_POLICY: delete
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *json-logging
    deploy:
      resources:
        reservations:
          memory: 768M
        limits:
          cpus: "2.0"
          memory: 2G

  kafka-init:
    logging: *json-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  kafka-topics:
    logging: *json-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  migrate:
    environment:
      MYSQL_URL: ""
      MYSQL_URL_FILE: /run/secrets/mysql_url
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    secrets: *app-secrets
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *json-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  api:
    image: frontend-insight-app:${FI_RELEASE_ID:-local}
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${FI_LOG_LEVEL:-info}
      MYSQL_URL: ""
      MYSQL_URL_FILE: /run/secrets/mysql_url
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      ACCOUNT_HMAC_KEY: ""
      ACCOUNT_HMAC_KEY_FILE: /run/secrets/account_hmac_key
      AUTH_TOKEN_SECRET: ""
      AUTH_TOKEN_SECRET_FILE: /run/secrets/auth_token_secret
      REFRESH_COOKIE_SECURE: "true"
      INGESTION_RATE_LIMIT_PER_MINUTE: ${FI_INGESTION_RATE_LIMIT_PER_MINUTE:-600}
    secrets:
      - mysql_url
      - clickhouse_password
      - account_hmac_key
      - auth_token_secret
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    logging: *json-logging
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          cpus: "1.5"
          memory: 768M

  consumer:
    image: frontend-insight-app:${FI_RELEASE_ID:-local}
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${FI_LOG_LEVEL:-info}
      MYSQL_URL: ""
      MYSQL_URL_FILE: /run/secrets/mysql_url
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CONSUMER_GROUP_ID: ${FI_CONSUMER_GROUP_ID:-frontend-insight-production-v1}
    secrets: *app-secrets
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    logging: *json-logging
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          cpus: "2.0"
          memory: 1G

  seed:
    environment:
      MYSQL_URL: ""
      MYSQL_URL_FILE: /run/secrets/mysql_url
    secrets:
      - mysql_url
    profiles: [synthetic]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *json-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  verifier:
    environment:
      MYSQL_URL: ""
      MYSQL_URL_FILE: /run/secrets/mysql_url
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    secrets: *app-secrets
    profiles: [synthetic]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *json-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  web:
    image: frontend-insight-web:${FI_RELEASE_ID:-local}
    entrypoint: []
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=16m,mode=1777
    logging: *json-logging
    deploy:
      resources:
        reservations:
          memory: 32M
        limits:
          cpus: "0.5"
          memory: 128M

  demo:
    profiles: [synthetic]

secrets:
  mysql_root_password:
    file: ${FI_SECRETS_DIR:?set FI_SECRETS_DIR}/mysql_root_password
  mysql_password:
    file: ${FI_SECRETS_DIR:?set FI_SECRETS_DIR}/mysql_password
  mysql_url:
    file: ${FI_SECRETS_DIR:?set FI_SECRETS_DIR}/mysql_url
  clickhouse_password:
    file: ${FI_SECRETS_DIR:?set FI_SECRETS_DIR}/clickhouse_password
  account_hmac_key:
    file: ${FI_SECRETS_DIR:?set FI_SECRETS_DIR}/account_hmac_key
  auth_token_secret:
    file: ${FI_SECRETS_DIR:?set FI_SECRETS_DIR}/auth_token_secret
