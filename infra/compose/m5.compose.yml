services:
  r2-verifier:
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    command: [pnpm, --filter, "@frontend-insight/server-core", verify:r2]
    environment:
      MYSQL_URL: mysql://frontend_insight:${M24_MYSQL_PASSWORD:-m5-mysql-local-only}@mysql:3306/frontend_insight
      FI_API_URL: http://api:3000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USERNAME: frontend_insight
      CLICKHOUSE_PASSWORD: ${M24_CLICKHOUSE_PASSWORD:-m24-clickhouse-local-only}
      MYSQL_UPGRADE_URL: mysql://frontend_insight:${M24_MYSQL_PASSWORD:-m5-mysql-local-only}@mysql:3306/frontend_insight_r2_upgrade
      GITHUB_RUN_ID: ${GITHUB_RUN_ID:-local}
    depends_on:
      api:
        condition: service_healthy
    profiles: [tools]
    networks: [m24]

  r1b-verifier:
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    command: [pnpm, --filter, "@frontend-insight/server-core", verify:r1b]
    environment:
      MYSQL_URL: mysql://frontend_insight:${M24_MYSQL_PASSWORD:-m5-mysql-local-only}@mysql:3306/frontend_insight
      FI_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    profiles: [tools]
    networks: [m24]

  r1a-verifier:
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    command: [pnpm, --filter, "@frontend-insight/server-core", verify:r1a]
    environment:
      MYSQL_URL: mysql://frontend_insight:${M24_MYSQL_PASSWORD:-m5-mysql-local-only}@mysql:3306/frontend_insight
      FI_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    profiles: [tools]
    networks: [m24]

  seed:
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    command: [pnpm, --filter, "@frontend-insight/server-core", seed:r0]
    environment:
      MYSQL_URL: mysql://frontend_insight:${M24_MYSQL_PASSWORD:-m5-mysql-local-only}@mysql:3306/frontend_insight
      M5_PROJECT_ORIGINS: http://localhost:${M5_WEB_PORT:-4173},http://127.0.0.1:${M5_WEB_PORT:-4173},http://localhost:${M5_DEMO_PORT:-4174},http://127.0.0.1:${M5_DEMO_PORT:-4174}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]
    networks: [m24]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/m5-web.Dockerfile
      args:
        APP_DIR: web
    ports: ["127.0.0.1:${M5_WEB_PORT:-4173}:8080"]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "wget --quiet --tries=1 --spider http://127.0.0.1:8080/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [m24]

  demo:
    build:
      context: ../..
      dockerfile: infra/docker/m5-web.Dockerfile
      args:
        APP_DIR: demo-app
    ports: ["127.0.0.1:${M5_DEMO_PORT:-4174}:8080"]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "wget --quiet --tries=1 --spider http://127.0.0.1:8080/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [m24]
