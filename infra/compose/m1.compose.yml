services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${M1_MYSQL_ROOT_PASSWORD:-m1-root-local-only}
      MYSQL_DATABASE: frontend_insight_m1
      MYSQL_USER: m1
      MYSQL_PASSWORD: ${M1_MYSQL_PASSWORD:-m1-mysql-local-only}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    networks: [m1]

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: frontend_insight_m1
      CLICKHOUSE_USER: m1
      CLICKHOUSE_PASSWORD: ${M1_CLICKHOUSE_PASSWORD:-m1-clickhouse-local-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    networks: [m1]

  migration-runner:
    build:
      context: ../..
      dockerfile: infra/docker/m1-runner.Dockerfile
    environment:
      MYSQL_URL: mysql://m1:${M1_MYSQL_PASSWORD:-m1-mysql-local-only}@mysql:3306/frontend_insight_m1
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USERNAME: m1
      CLICKHOUSE_PASSWORD: ${M1_CLICKHOUSE_PASSWORD:-m1-clickhouse-local-only}
      CLICKHOUSE_DATABASE: frontend_insight_m1
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [m1]

volumes:
  mysql-data:
  clickhouse-data:

networks:
  m1:
    driver: bridge
