services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${M24_MYSQL_ROOT_PASSWORD:-m24-root-local-only}
      MYSQL_DATABASE: frontend_insight
      MYSQL_USER: frontend_insight
      MYSQL_PASSWORD: ${M24_MYSQL_PASSWORD:-m24-mysql-local-only}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [m24]

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: frontend_insight
      CLICKHOUSE_USER: frontend_insight
      CLICKHOUSE_PASSWORD: ${M24_CLICKHOUSE_PASSWORD:-m24-clickhouse-local-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: [clickhouse-data:/var/lib/clickhouse]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 2G
    networks: [m24]

  kafka-init:
    image: apache/kafka:4.1.1
    user: "0:0"
    entrypoint: [/bin/sh, -c]
    command: ["chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    restart: "no"
    networks: [m24]

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536M
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks: [m24]

  kafka-topics:
    image: apache/kafka:4.1.1
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic frontend-insight.events.v1 --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic frontend-insight.events.dlq.v1 --partitions 1 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks: [m24]

  migrate:
    build: &app-build
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    command: [pnpm, migrate, all]
    environment: &database-environment
      MYSQL_URL: mysql://frontend_insight:${M24_MYSQL_PASSWORD:-m24-mysql-local-only}@mysql:3306/frontend_insight
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USERNAME: frontend_insight
      CLICKHOUSE_PASSWORD: ${M24_CLICKHOUSE_PASSWORD:-m24-clickhouse-local-only}
      CLICKHOUSE_DATABASE: frontend_insight
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [m24]

  api:
    build: *app-build
    command: [pnpm, --filter, "@frontend-insight/api", start]
    environment:
      <<: *database-environment
      NODE_ENV: development
      LOG_LEVEL: info
      API_PORT: "3000"
      KAFKA_BROKERS: kafka:9092
      KAFKA_EVENTS_TOPIC: frontend-insight.events.v1
      KAFKA_DLQ_TOPIC: frontend-insight.events.dlq.v1
      ACCOUNT_HMAC_KEY: ${M24_ACCOUNT_HMAC_KEY:-m24-account-hmac-key-change-me-32chars}
      AUTH_TOKEN_SECRET: ${M24_AUTH_TOKEN_SECRET:-m24-auth-token-secret-change-me-32chars}
      REFRESH_COOKIE_SECURE: "false"
    ports: ["127.0.0.1:${M24_API_PORT:-3000}:3000"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    networks: [m24]

  consumer:
    build: *app-build
    command: [pnpm, --filter, "@frontend-insight/consumer", start]
    environment:
      <<: *database-environment
      NODE_ENV: development
      LOG_LEVEL: info
      KAFKA_BROKERS: kafka:9092
      KAFKA_EVENTS_TOPIC: frontend-insight.events.v1
      KAFKA_DLQ_TOPIC: frontend-insight.events.dlq.v1
      CONSUMER_GROUP_ID: frontend-insight-m24
      CONSUMER_BATCH_SIZE: "500"
      CONSUMER_FLUSH_TIMEOUT_MS: "5000"
      CONSUMER_MAX_RETRIES: "3"
      CONSUMER_RETRY_PAUSE_MS: "30000"
      CONSUMER_HEALTH_PORT: "3200"
    ports: ["127.0.0.1:${M24_CONSUMER_PORT:-3200}:3200"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3200/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    networks: [m24]

  verifier:
    build: *app-build
    command: [pnpm, --filter, "@frontend-insight/server-core", verify:flow]
    environment:
      <<: *database-environment
      M24_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
      consumer:
        condition: service_healthy
    profiles: [verify]
    networks: [m24]

volumes:
  mysql-data:
  clickhouse-data:
  kafka-data:

networks:
  m24:
    driver: bridge
